name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test with temporary FRP forwarding
        run: node scripts/test-frp.mjs
      - run: |
          mkdir -p release
          cp -R dist release/dist
          tar -czf tunnel.tar.gz release docker-compose.yml .env.example README.md AIO.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel
          path: tunnel.tar.gz
