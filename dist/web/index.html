<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务入口</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body>
<header><span class="brand"><span class="mark">↗</span> Tunnel</span><span class="subtitle" data-i18n="subtitle"></span><button id="logout" hidden data-i18n="logout"></button></header>
<main>
<section id="login" class="login" hidden><h1 data-i18n="welcome"></h1><form id="login-form"><label><span data-i18n="account"></span><input name="user" autocomplete="username" required></label><label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label><button class="primary" data-i18n="login"></button></form></section>
<section id="workspace" hidden>
<div class="heading"><div><h1 data-i18n="services"></h1><span id="domain" class="domain"></span></div><div class="actions"><span id="panel-tools" class="actions"></span><button id="refresh" data-i18n="refresh"></button><button id="export-button" data-i18n="exportServices"></button><button id="vault-button" data-i18n="vault"></button></div></div>
<div class="panel table-wrap"><table><thead><tr><th data-i18n="domain"></th><th>入口归属</th><th data-i18n="device"></th><th>连接方式</th><th>目标</th><th>连接地址</th><th>访问范围</th><th>DNS 方式</th><th data-i18n="note"></th><th data-i18n="actions"></th></tr></thead><tbody id="rows"></tbody></table><p id="empty" data-i18n="empty" hidden></p></div>
<div id="panel-mount"></div>
<div id="publication" role="status" aria-live="polite"></div>
</section>
<p id="message" role="status" aria-live="polite" hidden></p>
</main>
<dialog id="vault-dialog"><div class="heading"><h2 data-i18n="vault"></h2><button type="button" data-close="vault-dialog" data-i18n="close"></button></div>
<div class="heading"><label class="vault-search"><span data-i18n="vaultSearch"></span><input id="vault-search" placeholder="" autocomplete="off"></label><div class="actions"><button type="button" id="vault-export" data-i18n="exportVault"></button><button type="button" id="vault-export-secrets" class="primary" data-i18n="exportVaultSecrets"></button></div></div>
<div class="table-wrap"><table><thead><tr><th data-i18n="name"></th><th data-i18n="category"></th><th data-i18n="address"></th><th data-i18n="username"></th><th data-i18n="actions"></th></tr></thead><tbody id="vault-rows"></tbody></table><p id="vault-empty" data-i18n="vaultEmpty" hidden></p></div>
<form id="vault-form" class="service-form">
<label><span data-i18n="name"></span><input name="name" required maxlength="80" autocomplete="off"></label>
<label><span data-i18n="category"></span><input name="category" maxlength="32" placeholder="数据库 / 中间件 / 站点 / 云控制台" autocomplete="off"></label>
<label><span data-i18n="address"></span><input name="url" maxlength="512" placeholder="https://tj-web.lyokm.cn 或 raw.lyokm.cn:5432" autocomplete="off"></label>
<label><span data-i18n="username"></span><input name="username" maxlength="256" autocomplete="off"></label>
<label><span data-i18n="password"></span><input name="password" type="password" maxlength="1024" autocomplete="new-password"></label>
<label><span data-i18n="note"></span><input name="note" maxlength="300" autocomplete="off"></label>
<button class="primary" data-i18n="vaultSave"></button>
</form></dialog>
</body></html>
